<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', Tahoma, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .label { font-size: 18px; fill: #1f2933; }
    .title { font-size: 22px; font-weight: 600; fill: #1f2933; }
    .box { fill: #e8f0fe; stroke: #2563eb; stroke-width: 2.5; rx: 16; }
    .subbox { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .note { font-size: 14px; fill: #4b5563; }
    .wire { stroke: #111827; stroke-width: 2.5; marker-end: url(#arrow); }
    .wire-dash { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#111827" />
    </marker>
  </defs>

  <text x="480" y="48" text-anchor="middle" class="title">Sơ đồ nguyên lý hệ thống quan trắc không khí</text>

  <!-- ESP32 block -->
  <rect class="box" x="80" y="120" width="240" height="240"/>
  <text x="200" y="160" text-anchor="middle" class="label">ESP32</text>
  <g>
    <rect class="subbox" x="110" y="190" width="180" height="50"/>
    <text x="200" y="220" text-anchor="middle" class="label">GPIO16 (RX2)</text>
    <rect class="subbox" x="110" y="250" width="180" height="50"/>
    <text x="200" y="280" text-anchor="middle" class="label">GPIO17 (TX2)</text>
    <rect class="subbox" x="110" y="310" width="180" height="50"/>
    <text x="200" y="340" text-anchor="middle" class="label">GPIO34 (ADC1)</text>
  </g>
  <text x="200" y="372" text-anchor="middle" class="note">Nguồn 5V &amp; GND dùng chung</text>

  <!-- PMS7003 block -->
  <rect class="box" x="380" y="80" width="220" height="200" fill="#ecfdf5" stroke="#10b981"/>
  <text x="490" y="120" text-anchor="middle" class="label">PMS7003</text>
  <g>
    <rect class="subbox" x="410" y="150" width="160" height="44" stroke="#10b981"/>
    <text x="490" y="176" text-anchor="middle" class="label">TX → ESP32 RX2</text>
    <rect class="subbox" x="410" y="204" width="160" height="44" stroke="#10b981"/>
    <text x="490" y="230" text-anchor="middle" class="label">RX ← ESP32 TX2</text>
  </g>
  <text x="490" y="260" text-anchor="middle" class="note">SET kéo lên 5V, nguồn 5V</text>

  <!-- MQ135 block -->
  <rect class="box" x="380" y="320" width="220" height="160" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="490" y="360" text-anchor="middle" class="label">MQ135</text>
  <rect class="subbox" x="410" y="380" width="160" height="50" stroke="#f59e0b"/>
  <text x="490" y="410" text-anchor="middle" class="label">AO → ESP32 ADC</text>
  <text x="490" y="450" text-anchor="middle" class="note">Nguồn 5V &amp; Heater ~150mA</text>

  <!-- Raspberry Pi block -->
  <rect class="box" x="700" y="180" width="200" height="200" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="800" y="220" text-anchor="middle" class="label">Raspberry Pi 4</text>
  <rect class="subbox" x="730" y="250" width="140" height="60" stroke="#0284c7"/>
  <text x="800" y="286" text-anchor="middle" class="label">MQTT Broker</text>
  <text x="800" y="340" text-anchor="middle" class="note">Collector Python ghi InfluxDB</text>

  <!-- Connections -->
  <line class="wire" x1="320" y1="215" x2="380" y2="180"/>
  <line class="wire" x1="320" y1="275" x2="380" y2="204"/>
  <line class="wire" x1="320" y1="335" x2="380" y2="405"/>
  <line class="wire" x1="250" y1="168" x2="490" y2="260" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line class="wire" x1="280" y1="420" x2="430" y2="470" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line class="wire-dash" x1="300" y1="200" x2="700" y2="200"/>
  <text x="500" y="188" text-anchor="middle" class="note">Wi-Fi MQTT</text>
  <text x="520" y="485" class="note">*Tất cả module dùng chung GND và nguồn 5V ổn định*</text>
</svg>
