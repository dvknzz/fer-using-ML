version: "3.8"

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: air_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: air_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file:
      - ./influxdb.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  grafana:
    image: grafana/grafana-oss:11.1.3
    container_name: air_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  backend:
    build:
      context: ../..
      dockerfile: edge/raspberry_pi/backend.Dockerfile
    container_name: air_backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    depends_on:
      - mqtt
      - influxdb
    ports:
      - "8000:8000"
    volumes:
      - backend_models:/app/backend/artifacts

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
  backend_models:
